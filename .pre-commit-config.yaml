default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.9
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: pnpm exec eslint --fix
        language: system
        files: ^src/.*\.(js|ts|jsx|tsx)$
        stages: [pre-commit]
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write
        language: system
        files: ^src/.*\.(js|ts|jsx|tsx|css|scss|html)$
        stages: [pre-commit]
      - id: check
        name: check
        entry: pnpm check
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: common-link
        name: web-common linked locally
        entry: sh node_modules/gtfs-zone-web-common/bin/common-link.sh check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
