name: Vulnerability scan

# Scans pnpm-lock.yaml with scripts/vuln-gate.sh and fails on any critical finding.
# On main, the result is pushed to status.gtfs.zone.

on:
  push:
  pull_request:
  # Daily, so advisories published after the last push still show up.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vuln-scan:
    uses: gtfs-zone/.github/.github/workflows/vuln-scan.yml@8a19d97ce36f71336fd37fe02a1553444306ac2e # main
    secrets:
      gatus-token: ${{ secrets.GATUS_VULN_SCAN_TOKEN }}
