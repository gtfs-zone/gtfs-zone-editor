name: Release

# Run by hand: bumps the version on main with cz bump and pushes the bump
# commit and its tag as the gtfs-zone-release app. The tag push starts
# pages.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    uses: gtfs-zone/.github/.github/workflows/release.yml@d8f10454d1c5156283f096ebded47d4b56af80f5 # main
    secrets:
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
